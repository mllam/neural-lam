[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling>=1.27" ]

[project]
name = "neural-lam"
description = "LAM-based data-driven forecasting"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Joel Oskarsson", email = "joel.oskarsson@outlook.com" },
  { name = "Simon Adamov", email = "Simon.Adamov@meteoswiss.ch" },
  { name = "Leif Denby", email = "lcd@dmi.dk" },
  { name = "Simon Kamuk Christiansen", email = "skc@dmi.dk" },
  { name = "Kasper Hintz", email = "kah@dmi.dk" },
  { name = "Erik Larsson", email = "erik.larsson@liu.se" },
  { name = "Hauke Schulz", email = "has@dmi.dk" },
  { name = "Daniel Holmberg", email = "daniel.holmberg@helsinki.fi" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "boto3>=1.35.32",
  "cartopy>=0.22",
  "dataclass-wizard<0.31",
  "matplotlib>=3.7",
  "mlflow>=2.16.2",
  "mllam-data-prep>=0.5",
  "networkx>=3",
  "numpy>=1.24.2",
  "nvidia-ml-py>=13.580.82",
  "parse>=1.20.2",
  "pillow>=9",
  "plotly>=5.15",
  "pyproj>=3.4.1",
  "pytorch-lightning>=2.0.3",
  "scipy>=1.10",
  "shapely>=2.0.1",
  "torch>=2.3",
  "torch-geometric==2.3.1",
  "tueplots>=0.0.8",
  "wandb>=0.13.10",
]

# The torch variant is selected at install time via these mutually-exclusive
# extras (see [tool.uv]). Versions are pinned per CUDA build because not every
# torch release ships wheels for every CUDA version, e.g. cu128 wheels were
# dropped in torch 2.12, so the cu128 extra stays on the 2.11 series.
[project.optional-dependencies]
cpu = ["torch>=2.12,<2.13"]
gpu = ["torch>=2.12,<2.13"]        # CUDA 13.0, default GPU build
gpu-cu128 = ["torch>=2.11,<2.12"]  # CUDA 12.8, last torch series with cu128 wheels

[dependency-groups]
dev = [ "pooch>=1.8.2", "pre-commit>=3.8", "pytest>=8.3.2" ]

[tool.uv]
# uv-specific configuration for PyTorch CPU/GPU variant selection.
# NOTE: --torch-backend is only supported in `uv pip`, not `uv sync`.
# Tracking issue for project-interface support: https://github.com/astral-sh/uv/issues/12994
# Until then, we use extras + explicit index routing for `uv sync`.
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "gpu-cu128" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
    { index = "pytorch-cu128", extra = "gpu-cu128" },
]

[tool.hatch]
build.targets.sdist.exclude = [
  ".venv/",
  "venv/",
]
build.targets.wheel.exclude = [
  ".venv/",
  "venv/",
]
metadata.core-metadata-version = "2.4"
version.source = "vcs"
version.fallback-version = "0.0.0"

[tool.ruff]
target-version = "py310"
line-length = 80
# Avoid notebook churn from lint-only modernization.
extend-exclude = [ "docs/notebooks/*.ipynb" ]
lint.select = [ "E", "F", "G", "I", "PT", "PTH", "S", "TCH", "UP", "W" ]
lint.ignore = [
  "E203",   # Keep Black-compatible whitespace behaviour
  "PT006",  # Existing parameterize style to be tightened incrementally
  "PT007",  # Existing parameterize value style to be tightened incrementally
  "PTH103", # pathlib migration will be done incrementally
  "PTH118", # pathlib migration will be done incrementally
  "PTH123", # pathlib migration will be done incrementally
  "S101",   # Allow assert usage for now (extensive in tests and checks)
  "S311",   # Pseudo-random usage is non-cryptographic in this codebase
  "S603",   # subprocess calls are currently intentional and reviewed manually
  "S607",   # Allow partial executable paths in controlled environments
  "UP006",  # Typing modernization deferred to follow-up cleanup
  "UP007",  # Typing modernization deferred to follow-up cleanup
  "UP022",  # Redirect modernisation deferred to follow-up cleanup
  "UP035",  # Deprecated import migration deferred to follow-up cleanup
  "UP045",  # Optional/Union modernization deferred to follow-up cleanup
]
lint.per-file-ignores."__init__.py" = [ "F401" ]
lint.isort.import-heading = { first-party = "First-party", local-folder = "Local", standard-library = "Standard library", third-party = "Third-party" }
lint.isort.known-first-party = [ "neural_lam", "tests" ]
lint.isort.known-third-party = [ "wandb" ]

[tool.ty.src]
exclude = ["tests/", "docs/"]

[tool.ty.rules]
possibly-missing-submodule = "ignore"

# Pylint config
[tool.pylint]
ignore = [
  "create_graph.py", # Disable linting for now, as major rework is planned/expected
]
# Temporary fix for import neural_lam statements until set up as proper package
init-hook = 'import sys; sys.path.append(".")'
"MESSAGES CONTROL".disable = [
  "C0114", # 'missing-module-docstring', Do not require module docstrings
  "R0901", # 'too-many-ancestors', Allow many layers of sub-classing
  "R0902", # 'too-many-instance-attribtes', Allow many attributes
  "R0913", # 'too-many-arguments', Allow many function arguments
  "R0914", # 'too-many-locals', Allow many local variables
  "W0223", # 'abstract-method', Subclasses do not have to override all abstract methods
]
DESIGN.max-statements = 100  # Allow for some more involved functions
IMPORTS.allow-any-import-level = "neural_lam"
SIMILARITIES.min-similarity-lines = 10
TYPECHECK.generated-members = [ "numpy.*", "torch.*" ]

[tool.codespell]
skip = "requirements/*"

[tool.interrogate]
fail-under = 100
verbose = 1
quiet = false
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-private = false
ignore-nested-functions = false
ignore-property-decorators = false
exclude = ["tests", "docs", "build"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselected by default, run with -m slow)",
]
