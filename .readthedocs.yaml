version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install uv
    - uv sync --extra docs --group dev --locked
    - uv run --locked python docs/export_notebooks.py
    - uv run --locked sphinx-build -W --keep-going -b html docs/ docs/_build/html/
    - cp -r docs/_build/html/* $READTHEDOCS_OUTPUT/html/
