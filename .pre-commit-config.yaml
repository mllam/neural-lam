repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
        description: Require specific codes on noqa comments

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        description: Check for spelling errors

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix]
        description: Lint Python code with Ruff
      - id: ruff-format
        description: Format Python code with Ruff

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.21.0
    hooks:
      - id: pyproject-fmt
        description: Normalize pyproject.toml formatting

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        description: Ensure documentation coverage stays perfect
        pass_filenames: false
        args: ["-c", "pyproject.toml", "neural_lam"]
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: graph-storage-spec
        name: Regenerate graph storage spec from validator
        entry: python docs/validate_graph.py --write-spec-to-path docs/graph_storage_spec.md
        language: python
        additional_dependencies: [PyYAML]
        pass_filenames: false
        files: ^docs/(validate_graph\.py|graph_storage_spec\.md)$
