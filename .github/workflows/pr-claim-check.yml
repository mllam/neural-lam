name: PR Claim Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-claim-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claim-check:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the default branch, never the PR head
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PR claim check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/pr_claim_check.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"
