name: Dependabot Changelog Entry

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  update-changelog:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: crambl/dependabot-changelog-writer@478f44ae023312b697349f9d12b646936020936f  #v1.3.1
        with:
          section-header: 'Maintenance'
          changelog-entry-pattern: 'Bump `[dep]` from [old] to [new] [pr-link] @dependabot'
          push-changes: 'false'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format Dependabot changelog entries
        run: python .github/scripts/format_dependabot_changelog.py

      - name: Commit and push formatted changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Updated changelog with updated dependencies"
            git push origin "HEAD:${HEAD_REF}"
          fi
