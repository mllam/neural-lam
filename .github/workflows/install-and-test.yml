# Configuration to test CPU and GPU installations with uv.
#
# torch is a required dependency in [project.dependencies]. The CPU/GPU variant
# is selected at install time via extras defined in pyproject.toml:
#
#   uv sync --extra cpu       --group dev  # CPU runners
#   uv sync --extra gpu       --group dev  # GPU runners (CUDA 13.0, default)
#   uv sync --extra gpu-cu128 --group dev  # GPU runners (CUDA 12.8)
#
# The extras route torch to the correct PyTorch index via [tool.uv.sources]
# and [[tool.uv.index]] in pyproject.toml.
#
# We only run uv in CI: pip cannot do extras-based index routing and resolving
# the right CPU/GPU torch wheel with pip is brittle. The pip install path is
# still documented in the README for users who prefer it.
#
# Hosts used to run the tests:
# - ubuntu-latest for CPU: these are on github
# - cirun-aws-runner--${{ github.run_id }} for GPU: these are on AWS,
#   orchestrated by cirun.io
#
# GPU test scope:
# - The GPU job installs the gpu-cu128 extra (CUDA 12.8), which is compatible
#   with the cirun runner's CUDA 12.2 driver via minor-version forward
#   compatibility.
# - It asserts torch.cuda.is_available() so a future driver/wheel mismatch
#   fails fast rather than silently running on CPU.
# - Only GPU-relevant tests are run on the paid cirun runner:
#   * tests marked requires_training (trainer.fit() exercises CUDA paths)
#   * tests/test_gpu_normalization.py (on_after_batch_transfer on GPU)
# - The full suite continues to run on the free ubuntu-latest CPU runner.
name: CPU+GPU testing

on: [push, pull_request, workflow_dispatch]



jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    env:
      FSSPEC_SIMPLECACHE_CACHE_STORAGE: ${{ github.workspace }}/.fsspec-cache
    strategy:
      matrix:
        device: [cpu, gpu]
        include:
          - device: cpu
            runner: ubuntu-latest
            extra: cpu
          - device: gpu
            runner: "cirun-aws-runner--${{ github.run_id }}"
            extra: gpu-cu128

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install with uv
        run: |
          uv sync --extra ${{ matrix.extra }} --group dev --locked
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Print torch version
        run: |
          python -c "import torch; print(torch.__version__)"

      - name: Check torch variant is cpu
        if: matrix.device == 'cpu'
        run: |
          python -c "import torch; assert torch.__version__.endswith('+cpu')"

      - name: Check torch variant is cu128
        if: matrix.device == 'gpu'
        run: |
          python -c "import torch; assert torch.__version__.endswith('+cu128')"

      - name: Check CUDA is available
        if: matrix.device == 'gpu'
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA is not available - torch/driver version mismatch'"

      - name: Cache meps example data
        uses: actions/cache@v4
        with:
          path: tests/datastore_examples/npyfilesmeps/meps_example_reduced.v0.3.0.tar.gz
          key: ${{ runner.os }}-meps-reduced-example-data-v0.3.0

      - name: Cache mdp input data
        uses: actions/cache@v4
        with:
          path: .fsspec-cache
          key: ${{ runner.os }}-mdp-input-v1-${{ hashFiles('tests/datastore_examples/mdp/**/*.datastore.yaml') }}

      - name: Run tests (CPU - full suite)
        if: matrix.device == 'cpu'
        run: |
          pytest -vv -s --doctest-modules

      - name: Run tests (GPU - training and GPU-specific tests only)
        if: matrix.device == 'gpu'
        run: |
          pytest -vv -s -m requires_training
          pytest -vv -s tests/test_gpu_normalization.py

      - name: Upload test figures
        uses: actions/upload-artifact@v4
        with:
          name: test-figures-${{ matrix.device }}
          path: tests/test_outputs/
          if-no-files-found: warn
          retention-days: 30
